# Preprod environment values

replicaCount: 1

image:
  repository: apache/kafka
  tag: "3.7.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9092

kraft:
  clusterId: ""
  nodeId: 1
  listeners: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
  advertisedListeners: "PLAINTEXT://sie-event-bus-kafka.sie.svc.cluster.local:9092"
  controllerListenerNames: "CONTROLLER"
  listenerSecurityProtocolMap: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  interBrokerListenerName: "PLAINTEXT"
  controllerQuorumVoters: "1@localhost:9093"

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

nodeSelector: {}
tolerations: []
affinity: {}
