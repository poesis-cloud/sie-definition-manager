apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sie-event-bus-kafka.fullname" . }}
  labels:
{{ include "sie-event-bus-kafka.labels" . | indent 4 }}
spec:
  serviceName: {{ include "sie-event-bus-kafka.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "sie-event-bus-kafka.name" . }}
  template:
    metadata:
      labels:
{{ include "sie-event-bus-kafka.labels" . | indent 8 }}
    spec:
      containers:
        - name: kafka
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "sie-event-bus-kafka.fullname" . }}-kraft
                  key: CLUSTER_ID
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_NODE_ID
              value: {{ .Values.kraft.nodeId | quote }}
            - name: KAFKA_LISTENERS
              value: {{ .Values.kraft.listeners | quote }}
            - name: KAFKA_ADVERTISED_LISTENERS
              value: {{ default (printf "PLAINTEXT://%s:%d" (include "sie-event-bus-kafka.fullname" .) (.Values.service.port | int)) .Values.kraft.advertisedListeners | quote }}
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: {{ .Values.kraft.controllerListenerNames | quote }}
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: {{ .Values.kraft.listenerSecurityProtocolMap | quote }}
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: {{ .Values.kraft.interBrokerListenerName | quote }}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: {{ .Values.kraft.controllerQuorumVoters | quote }}
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
{{ toYaml .Values.resources | indent 12 }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      {{- if not .Values.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
{{ toYaml .Values.persistence.accessModes | indent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
  {{- else }}
  volumeClaimTemplates: []
  {{- end }}
