{{- if .Values.deployApp }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sie-definition-manager.fullname" . }}-secret
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.DB_PASSWORD is required (inject from CI/CD secret store)" .Values.secrets.DB_PASSWORD | quote }}
  # $gsm:dataProtection hash key. One-way transform: this key has the same lifetime
  # as the data it protects — changing it makes every stored hash unmatchable.
  DM_PROTECTION_HASH_KEY: {{ required "secrets.DM_PROTECTION_HASH_KEY is required (inject from CI/CD secret store)" .Values.secrets.DM_PROTECTION_HASH_KEY | quote }}
{{- end }}
