apiVersion: v2
name: sie-definition-manager
description: Umbrella chart for SIE Definition Manager and its dependencies
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  # sie-event-bus and sie-schema-registry source repos are retired; their chart
  # sources are vendored in-repo under ops/helm-deps/.
  - name: sie-event-bus-kafka
    version: "0.1.0"
    repository: "file://../helm-deps/sie-event-bus-kafka"
    alias: eventbus
  - name: sie-schema-registry
    version: "0.1.0"
    repository: "file://../helm-deps/sie-schema-registry"
    alias: schemaregistry
  - name: sie-definition-database
    version: "0.1.0"
    repository: "file://../../../sie-definition-database/ops/helm"
    alias: definitiondatabase
