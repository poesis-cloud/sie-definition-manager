name: dm-cd

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - aks
          - onprem
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - preprod
          - prod

permissions:
  contents: read

# One deploy at a time per environment; never cancel an in-flight deploy.
concurrency:
  group: dm-cd-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_digest: ${{ steps.meta.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        # Full verify: never ship an image whose tests did not run in this pipeline.
        run: mvn -B verify
      - name: Generate SBOM
        run: mvn -B cyclonedx:makeAggregateBom
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/sie-definition-manager:${{ github.sha }} .
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/sie-definition-manager:${{ github.sha }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Resolve pushed digest
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/sie-definition-manager:${GITHUB_SHA}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}" | cut -d'@' -f2)"
          test -n "${digest}" || { echo "Could not resolve pushed image digest" >&2; exit 1; }
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Cosign sign (by digest)
        # Signing the digest, not the tag: tags are mutable, digests are not.
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/sie-definition-manager@${{ steps.meta.outputs.image_digest }}"

  prod-deploy:
    if: ${{ github.event.inputs.target == 'aks' }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Azure OIDC login
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
      - name: Validate required deploy secrets
        env:
          DM_DB_PASSWORD: ${{ secrets.DM_DB_PASSWORD }}
          DEF_DB_ADMIN_PASSWORD: ${{ secrets.DEF_DB_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${DM_DB_PASSWORD}" || { echo "Missing required environment secret: DM_DB_PASSWORD" >&2; exit 1; }
          test -n "${DEF_DB_ADMIN_PASSWORD}" || { echo "Missing required environment secret: DEF_DB_ADMIN_PASSWORD" >&2; exit 1; }
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Verify image signature
        # Deploy only what the package job provably signed.
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/${{ github.repository_owner }}/sie-definition-manager@${{ needs.package.outputs.image_digest }}"
      - name: Deploy with Makefile
        env:
          DM_DB_PASSWORD: ${{ secrets.DM_DB_PASSWORD }}
          DEF_DB_ADMIN_PASSWORD: ${{ secrets.DEF_DB_ADMIN_PASSWORD }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/sie-definition-manager
          IMAGE_TAG: ${{ needs.package.outputs.image_tag }}
        run: make prod-deploy DEPLOY_ENV=${{ github.event.inputs.environment }}

  deploy-onprem:
    if: ${{ github.event.inputs.target == 'onprem' }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Package helm chart
        run: make package-helm
      - name: Upload helm package
        uses: actions/upload-artifact@v4
        with:
          name: dm-helm-package
          path: "*.tgz"
