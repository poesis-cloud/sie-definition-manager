name: dm-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Report measured coverage
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [[ -f "$csv" ]]; then
            # Sum instruction columns across all classes (CSV: ...,INSTRUCTION_MISSED,INSTRUCTION_COVERED,...)
            pct=$(awk -F, 'NR>1 {m+=$4; c+=$5} END {if (m+c>0) printf "%.2f", 100*c/(m+c); else print "n/a"}' "$csv")
            echo "JaCoCo instruction coverage: ${pct}% (gate: >= 95%)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "JaCoCo report not produced (build failed before coverage)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dm-test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/bom.json

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Trivy is the single dependency/vuln gate (OWASP dependency-check was
      # redundant with it and NVD-rate-limited without an API key).
      - name: Trivy filesystem scan (gating)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
